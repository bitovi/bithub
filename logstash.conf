input {
	file {
		path => "/Users/neektza/projects/bitovi/bithub/log/development_crawler_listener.log"
		path => "/Users/neektza/projects/bitovi/bithub/log/development_crawler_poller.log"
		path => "/Users/neektza/projects/bitovi/bithub/log/development_listener.log"
		path => "/Users/neektza/projects/bitovi/bithub/log/development_rails.log"
		path => "/usr/local/var/log/nginx/bithub.loc.access.log"
	}
}

filter {
	grok {
		break_on_match => true
		match => { 
			"message" => [
				"\[%{TIMESTAMP_ISO8601:origin_ts}\]\[%{LOGLEVEL:loglevel}\]\:%{SPACE}\[EVENT_PUBLISHER\]\[%{NUMBER:brand_id},%{NUMBER:embed_id},%{NUMBER:service_id},%{WORD:feed_name},%{WORD:type_name}\]%{DATA}%{NUMBER:events_published}%{DATA}%{NUMBER:events_total}",
				"\[%{TIMESTAMP_ISO8601:origin_ts}\]\[%{LOGLEVEL:loglevel}\]\:%{SPACE}\[FETCHER\]%{SPACE}Fetching%{SPACE}%{WORD:feed_name}\/%{WORD:type_name}",
				"\[%{TIMESTAMP_ISO8601:origin_ts}\]\[%{LOGLEVEL:loglevel}\]\:%{SPACE}\[%{WORD:component}\]\[%{NUMBER:brand_id},%{NUMBER:embed_id},%{NUMBER:service_id},%{WORD:feed_name},%{WORD:type_name}\]%{SPACE}%{GREEDYDATA:message}",
				"\[%{TIMESTAMP_ISO8601:origin_ts}\]\[%{LOGLEVEL:loglevel}\]\:%{SPACE}method=%{WORD:http_method}%{SPACE}path=%{UNIXPATH:path}%{SPACE}format=%{WORD:req_format}%{SPACE}controller=%{DATA:controller_path}%{SPACE}action=%{WORD:controller_action}%{SPACE}status=%{NUMBER:http_status}%{SPACE}duration=%{NUMBER:duration_total}%{SPACE}view=%{NUMBER:duration_view}%{SPACE}db=%{NUMBER:duration_db}",
				"\[%{TIMESTAMP_ISO8601:origin_ts}\]\[%{LOGLEVEL:loglevel}\]\:%{SPACE}\[%{WORD:component}\]%{SPACE}%{GREEDYDATA:message}",
				"\[%{TIMESTAMP_ISO8601:origin_ts}\]\[%{LOGLEVEL:loglevel}\]\:%{SPACE}%{GREEDYDATA:message}" 
			]
		}
	}

	grok {
		match => {
			"message" => "%{IPORHOST:remote_addr} - %{USERNAME:remote_user} \[%{HTTPDATE:time_local}\] %{QS:request} %{INT:status} %{INT:body_bytes_sent} %{QS:http_referer} %{QS:http_user_agent}"
		}
	}

	mutate {
		convert => { "brand_id" => "integer" }
		convert => { "embed_id" => "integer" }
		convert => { "service_id" => "integer" }
		convert => { "duration_total" => "float" }
		convert => { "duration_db" => "float" }
		convert => { "duration_view" => "float" }
	}

}

output {
	stdout { codec => rubydebug }
	elasticsearch_http {
		host => "localhost"
		port => "9200"
	}
}
