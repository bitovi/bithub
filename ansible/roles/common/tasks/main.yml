- name: Install ansible apt dependecies
  apt: name={{ item }} state=installed
  with_items:
    - python-apt
    - aptitude

- name: Point apt sources to Debian unstable repos
  copy: src=sources.list dest=/etc/apt/sources.list

- name: Run apt-get update
  apt: update_cache=yes

- name: Run aptitude safe-upgrade
  apt: upgrade=safe

- name: Install grub
  shell: grub-install /dev/sda

- name: Install common deps
  apt: name={{ item }} state=installed
  with_items:
    - build-essential
    - libssl-dev
    - git
    - vim
    - htop
    - ack-grep
    - dnsutils
    - wget
    - ca-certificates
    - curl
    - unzip
