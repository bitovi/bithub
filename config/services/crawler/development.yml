:blog:
    :polling:
        :posts:
            :url: 'http://www.bitovi.com/blog.rss'
            :interval: 1

:forum:
    :polling:
        :general:
            :url: 'https://forum.javascriptmvc.com/feed'
            :interval: 1
        :questions:
            :url: 'https://forum.javascriptmvc.com/feed/filter/questions'
            :interval: 1

:disqus:
    :data:
        :auth: &disqus_auth
            :api_key: 'NgGGShovTbuUwxX61HNZvHreDse9DXrW8zvqlJOUhn6BVKJFISuYACtjhZ17FFZB'
    :polling:
        :posts:
            :url: 'http://disqus.com/api/3.0/posts/list.json'
            :interval: 1
            :query:
                <<: *disqus_auth
                :forum:
                    - 'jmvcs3'
                    - 'bitovi'
                :related:
                    - 'thread'
                    - 'forum'

:meetup:
    :data:
        :auth: &meetup_auth
            :key: "663a24605a37767831495d6332546b4a"
            :sign: "true"
    :polling:
        :open_events:
            :interval: 1
            :url: "https://api.meetup.com/2/open_events"
            :query:
                <<: *meetup_auth
                :text: "canjs"
                :fields: "event_hosts"
        :past_events:
            :interval: 1
            :url: "https://api.meetup.com/2/events"
            :query:
                <<: *meetup_auth
                :status: "past"
                :fields: "event_hosts"
            :boot_data_url: "http://bithub.dev/api/v2/crawler/event_ids"
        :rsvps:
            :interval: 1
            :url: "https://api.meetup.com/2/rsvps"
            :query:
                <<: *meetup_auth
            :boot_data_url: "http://bithub.dev/api/v2/crawler/event_ids"
    :streaming:
        :open_events:
            :url: "http://stream.meetup.com/2/open_events"


:github:
