log4r_config:
  loggers:
    - name          : component
      level         : DEBUG
      trace         : 'true'
      outputters    :
        - component_logfile
        - console

    - name          : active_record
      level         : DEBUG
      trace         : 'false'
      outputters    :
        - component_logfile

    - name          : action_controller
      level         : DEBUG
      trace         : 'false'
      outputters    :
        - component_logfile

  outputters:
    - name      : console
      type      : StdoutOutputter
      formatter :
        type: PatternFormatter
        pattern: '[%l]: %m '

    - name     : component_logfile
      type     : FileOutputter
      dirname  : ENV['LOG_DIR']
      filename : "log/#{ENV}_#{COMPONENT_NAME}.log"
      trunc    : true
      maxsize  : 104857600
      formatter:
        type: PatternFormatter
        pattern: '[#{ENV}][[%d][%l]: %m '
