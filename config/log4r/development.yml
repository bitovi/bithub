log4r_config:
  loggers:
    - name          : component
      level         : DEBUG
      trace         : 'true'
      outputters    :
        - component_logfile

  outputters:
    - name      : console
      type      : StdoutOutputter
      formatter :
        type    : PatternFormatter
        date_pattern: '%Y-%m-%dT%H:%M:%S%z'
        pattern : '[%d][%l]: %m'

    - name      : component_logfile
      type      : FileOutputter
      filename  : "log/#{ENV}_#{COMPONENT_NAME}.log"
      trunc     : true
      maxsize   : 104857600
      formatter :
        type    : PatternFormatter
        date_pattern: '%Y-%m-%dT%H:%M:%S%z'
        pattern : '[%d][%l]: %m'
